name: DSG checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # Blender 5.2 embeds Python 3.13
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "bpy==5.2.2" pytest ruff numpy scipy
      - name: Release gates (compile, lint, tests, Blender smoke)
        run: python tools/run_checks.py
      - name: Build add-on ZIP
        run: python tools/build_addon_zip.py --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dsg-addon
          path: dist/*.zip
