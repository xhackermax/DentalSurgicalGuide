name: DSG 9.10 release checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pure-test dependency
        run: python -m pip install numpy
      - name: Verify ZIP, exact source, contracts, metrics and codemap
        run: python tools/run_checks.py --no-smoke
      - name: Build add-on ZIP
        run: python tools/build_addon_zip.py --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dsg-9.10.11-addon
          path: |
            dist/*.zip
            dist/*.sha256
