name: DSG release checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pure-test dependencies
        run: python -m pip install numpy scipy scikit-image SimpleITK potpourri3d==1.4.0 pytest
      - name: Verify version, manifest and pure tests
        run: python tools/run_checks.py --no-smoke
      - name: Build add-on ZIP
        run: python tools/build_addon_zip.py --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dsg-addon
          path: |
            dist/*.zip
            dist/*.sha256
